<svg width="500" height="500" viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="500" height="500" fill="#000000" />
  <defs>
    <linearGradient id="kodium-logo-grad" x1="10%" y1="90%" x2="90%" y2="10%">
      <stop offset="0%" stopColor="#7C3AED" />
      <stop offset="35%" stopColor="#6366F1" />
      <stop offset="70%" stopColor="#0284C7" />
      <stop offset="100%" stopColor="#38BDF8" />
    </linearGradient>
    <style>
      .kodium-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 600;
        letter-spacing: 0.45em;
        fill: #FFFFFF;
      }
    </style>
  </defs>

  <!-- K Logo Mark -->
  <g transform="translate(100, 60) scale(3)">
    <!-- Stem of K -->
    <path d="M 28 80 V 27 L 44 14 V 42 L 37 49 L 44 56 V 80 H 28 Z" fill="url(#kodium-logo-grad)" />

    <!-- Upper diagonal arm -->
    <path d="M 40 44 L 78 26 V 40 L 48 57 L 40 44 Z" fill="url(#kodium-logo-grad)" />

    <!-- Lower diagonal arm -->
    <path d="M 48 57 L 78 78 H 63 L 40 54 L 48 57 Z" fill="url(#kodium-logo-grad)" />
  </g>

  <!-- K O D I U M Text -->
  <text x="260" y="420" text-anchor="middle" class="kodium-text" font-size="32">K O D I U M</text>
</svg>
